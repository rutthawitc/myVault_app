[package]
name = "my_vault"
version = "1.0.0"
edition = "2021"

[dependencies]
eframe = "0.32"
rfd = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
argon2 = "0.5"
password-hash = { version = "0.5", features = ["alloc"] }
rand = "0.8"
zeroize = "1.7"
chacha20poly1305 = "0.10"
walkdir = "2.5"

# CPU detection for worker-thread sizing
num_cpus = "1.16"

# Cross-platform support
dirs = "5.0"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winnt", "fileapi", "winbase", "winuser", "shellapi"] }

[package.metadata.bundle]
name = "My Vault"
identifier = "com.myvault.app"
version = "1.0.0"
category = "Utility"
short_description = "Secure file encryption"
long_description = "A secure file encryption application with military-grade cryptography (ChaCha20-Poly1305)"
icon = ["resources/icon.icns"]
